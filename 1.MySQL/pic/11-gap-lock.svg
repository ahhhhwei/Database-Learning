<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
  <style>
    .lock-box { fill: #fce4e4; stroke: #4a4a4a; stroke-width: 1.5; rx: 15px; ry: 15px; }
    .row-box { fill: #fffdf0; stroke: #4a4a4a; stroke-width: 1.5; rx: 4px; ry: 4px; }
    .label-text { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 15px; fill: #2d2d2d; text-anchor: middle; dominant-baseline: middle; }
    .id-text { font-family: "Microsoft YaHei", "PingFang SC", "SimSun", system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #2d2d2d; text-anchor: middle; dominant-baseline: middle; }
    .infinity-text { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 24px; font-weight: bold; fill: #2d2d2d; text-anchor: middle; dominant-baseline: middle; }
    .brace { fill: none; stroke: #4a4a4a; stroke-width: 1.5; stroke-linecap: round; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <g>
    <rect x="20" y="35" width="115" height="40" class="lock-box" />
    <text x="77.5" y="57" class="label-text">Gap Locks</text>
    <path d="M 152,20 Q 147,20 147,35 L 147,50 Q 147,55 141,55 Q 147,55 147,60 L 147,75 Q 147,90 152,90" class="brace" />
    <text x="365" y="55" class="infinity-text">-∞</text>
  </g>

  <g>
    <rect x="170" y="90" width="390" height="40" class="row-box" />
    <text x="365" y="112" class="id-text">ID = 10 的行</text>
  </g>

  <g>
    <rect x="20" y="145" width="115" height="40" class="lock-box" />
    <text x="77.5" y="167" class="label-text">Gap Locks</text>
    <path d="M 152,130 Q 147,130 147,145 L 147,160 Q 147,165 141,165 Q 147,165 147,170 L 147,185 Q 147,200 152,200" class="brace" />
  </g>

  <g>
    <rect x="170" y="200" width="390" height="40" class="row-box" />
    <text x="365" y="222" class="id-text">ID = 20 的行</text>
  </g>

  <g>
    <rect x="20" y="255" width="115" height="40" class="lock-box" />
    <text x="77.5" y="277" class="label-text">Gap Locks</text>
    <path d="M 152,240 Q 147,240 147,255 L 147,270 Q 147,275 141,275 Q 147,275 147,280 L 147,295 Q 147,310 152,310" class="brace" />
  </g>

  <g>
    <rect x="170" y="310" width="390" height="40" class="row-box" />
    <text x="365" y="332" class="id-text">ID = 30 的行</text>
  </g>

  <g>
    <rect x="20" y="365" width="115" height="40" class="lock-box" />
    <text x="77.5" y="387" class="label-text">Gap Locks</text>
    <path d="M 152,350 Q 147,350 147,365 L 147,380 Q 147,385 141,385 Q 147,385 147,390 L 147,405 Q 147,420 152,420" class="brace" />
    <text x="365" y="385" class="infinity-text">+∞</text>
  </g>
</svg>
