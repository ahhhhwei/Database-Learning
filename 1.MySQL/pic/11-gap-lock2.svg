<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" width="100%" height="100%">
  <style>
    .lock-box { fill: #fce4e4; stroke: #4a4a4a; stroke-width: 1.5; rx: 15px; ry: 15px; }
    .row-box { fill: #fffdf0; stroke: #4a4a4a; stroke-width: 1.5; rx: 4px; ry: 4px; }
    .label-text { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 15px; fill: #2d2d2d; text-anchor: middle; dominant-baseline: middle; }
    /* 显式指定多平台中文字体族，彻底解决乱码与方块问题 */
    .id-text { font-family: "Microsoft YaHei", "PingFang SC", "SimSun", system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #2d2d2d; text-anchor: middle; dominant-baseline: middle; }
    .infinity-text { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 24px; font-weight: bold; fill: #2d2d2d; text-anchor: middle; dominant-baseline: middle; }
    .brace { fill: none; stroke: #4a4a4a; stroke-width: 1.5; stroke-linecap: round; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />

  <g>
    <rect x="20" y="30" width="115" height="40" class="lock-box" />
    <text x="77.5" y="52" class="label-text">Gap Locks</text>
    
    <path d="M 152,15 Q 147,15 147,23 L 147,45 Q 147,50 141,50 Q 147,50 147,55 L 147,77 Q 147,85 152,85" class="brace" />
    
    <text x="365" y="52" class="infinity-text">-∞</text>
  </g>

  <g>
    <rect x="170" y="100" width="390" height="40" class="row-box" />
    <text x="365" y="122" class="id-text">ID = 10 的行</text>
  </g>

  <g>
    <rect x="20" y="270" width="115" height="40" class="lock-box" />
    <text x="77.5" y="292" class="label-text">Gap Locks</text>
    
    <path d="M 152,145 Q 147,145 147,155 L 147,285 Q 147,290 141,290 Q 147,290 147,295 L 147,425 Q 147,435 152,435" class="brace" />
  </g>

  <g>
    <rect x="170" y="180" width="390" height="40" class="row-box" />
    <text x="365" y="202" class="id-text">ID = 20 的行</text>
  </g>

  <g>
    <rect x="170" y="280" width="390" height="40" class="row-box" />
    <text x="365" y="302" class="id-text">ID = 30 的行</text>
  </g>

  <g>
    <text x="365" y="400" class="infinity-text">+∞</text>
  </g>
</svg>
